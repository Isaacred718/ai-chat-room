<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login">
    <form id="login-form">
      <h1>AI Chat Room</h1>
      <input id="email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <h2>Participants</h2>
      <ul id="participants"></ul>
      <h2>Machines</h2>
      <ul id="machines"></ul>
      <details class="dispatch">
        <summary>Live Dispatch</summary>
        <form id="dispatch-form">
          <textarea id="d-prompt" rows="4" placeholder="Prompt" required></textarea>
          <label>Lane <select id="d-lane"></select></label>
          <label>Complexity
            <select id="d-complexity">
              <option value="auto">Auto</option>
              <option value="light">Light</option>
              <option value="complex">Complex</option>
            </select>
          </label>
          <label>Route
            <select id="d-route">
              <option value="auto">Auto</option>
              <option value="mac">Mac</option>
              <option value="idw-2">IDW-2</option>
            </select>
          </label>
          <button type="submit">Dispatch</button>
        </form>
      </details>
      <div class="side-actions">
        <button id="clear-room" type="button">Clear room</button>
        <button id="sign-out" type="button">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <select id="c-target"></select>
        <input id="c-text" type="text" placeholder="Message…" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
      <p id="status" class="status"></p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
